services:
  # ------------------------------------------
  # Backend - Web Service
  # ------------------------------------------
  - type: web
    name: enem-quiz-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm ci --include=dev && npx tsc
    startCommand: cd backend && npx prisma migrate deploy && npx prisma db seed && npx ts-node src/main.ts
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: enem-quiz-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: THROTTLE_TTL
        value: 60
      - key: THROTTLE_LIMIT
        value: 5
    healthCheckPath: /
    
databases:
  # ------------------------------------------
  # PostgreSQL - Managed Database
  # ------------------------------------------
  - name: enem-quiz-db
    databaseName: enem_quiz_db
    user: quiz_user
    region: oregon
    plan: free
