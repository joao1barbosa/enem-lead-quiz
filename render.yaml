# Render Blueprint - ENEM Lead Quiz
# Documentação: https://docs.render.com/blueprints
#
# Para deployar:
# 1. Acesse https://render.com e faça login
# 2. Clique em "New +" → "Blueprint"
# 3. Conecte este repositório GitHub
# 4. O Render criará todos os serviços automaticamente
# 5. Após o deploy do backend, configure VITE_API_URL no frontend
#    (veja instruções abaixo)

services:
  # ------------------------------------------
  # Backend - Web Service
  # ------------------------------------------
  - type: web
    name: enem-quiz-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm ci --include=dev && npx tsc
    startCommand: cd backend && npx prisma migrate deploy && npx prisma db seed && npx ts-node src/main.ts
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: enem-quiz-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: THROTTLE_TTL
        value: 60
      - key: THROTTLE_LIMIT
        value: 5
    healthCheckPath: /

  # ------------------------------------------
  # Frontend - Web Service (Docker)
  # ------------------------------------------
  # ⚠️ APÓS O DEPLOY: Configure a variável VITE_API_URL no dashboard do Render
  #    com a URL pública do backend (ex: https://enem-quiz-backend.onrender.com)
  #    e redeploye o frontend.
  - type: web
    name: enem-quiz-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: VITE_API_URL
        value: https://enem-quiz-backend-rry9.onrender.com

databases:
  # ------------------------------------------
  # PostgreSQL - Managed Database
  # ------------------------------------------
  - name: enem-quiz-db
    databaseName: enem_quiz_db
    user: quiz_user
    region: oregon
    plan: free
